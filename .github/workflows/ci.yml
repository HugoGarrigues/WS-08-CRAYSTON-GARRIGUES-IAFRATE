name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Installer les dépendances
        run: npm ci
        working-directory: server
      - name: Vérifier le contrat OpenAPI
        run: npx --yes @stoplight/spectral-cli lint openapi.yaml openapi-v2.yaml
      - name: Protéger la v2 publiée sur main contre les ruptures
        run: |
          git fetch origin main
          git rev-parse --verify origin/main
          if git cat-file -e origin/main:openapi-v2.yaml 2>/dev/null; then
            mkdir -p tmp/tp6
            git show origin/main:openapi-v2.yaml > tmp/tp6/openapi-v2-main.yaml
            docker run --rm -v "$PWD":/specs:ro -w /specs tufin/oasdiff \
              breaking tmp/tp6/openapi-v2-main.yaml openapi-v2.yaml --fail-on ERR
          else
            echo "Première publication v2 : aucun contrat v2 sur main à comparer. Les deux contrats sont validés par Spectral."
          fi
      - name: Vérifier le code
        run: npm run lint
        working-directory: server
      - name: Tests d’intégration
        run: npm test
        working-directory: server

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Installer les dépendances
        run: npm ci
        working-directory: server
      - name: Construire le serveur et le contrat des opérations implémentées
        run: npm run contract:schema
        working-directory: server
      - name: Démarrer l’API
        run: node server/dist/main.js > tmp/tp5/server-ci.log 2>&1 &
      - name: Attendre la disponibilité de l’API
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:3000/health/live
      - name: Vérifier le contrat avec Schemathesis
        run: |
          docker run --rm --network host -v "$PWD":/specs:ro \
            -e SCHEMATHESIS_HOOKS=/specs/server/test/schemathesis_hooks.py \
            ghcr.io/schemathesis/schemathesis:4.33.4 --config-file /specs/schemathesis.toml \
            run /specs/tmp/tp5/openapi-implemented.json \
            --url http://localhost:3000 --checks all \
            --max-examples 20 --seed 20261119 --generation-database none
