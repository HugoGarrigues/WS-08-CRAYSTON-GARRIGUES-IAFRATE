  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Choix de contrat à confirmer : jeton opaque pour adhérent, admin ou borne. Le serveur vérifie
        le rôle et la propriété des ressources ; aucun jeton réel n’est fourni.'
  parameters:
    Page:
      name: page
      in: query
      description: Numéro de page, à partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Taille:
      name: taille
      in: query
      description: Nombre maximal d’éléments par page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Date:
      name: date
      in: query
      description: Jour civil dans le fuseau Europe/Paris.
      schema:
        type: string
        format: date
      example: '2026-10-29'
    RequestId:
      name: X-Request-Id
      in: header
      description: Identifiant de corrélation facultatif, sans effet sur l’idempotence.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000001
    salleId:
      name: salleId
      in: path
      required: true
      description: Identifiant UUID de la ressource.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000001
    adherentId:
      name: adherentId
      in: path
      required: true
      description: Identifiant UUID de la ressource.
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000001
    reservationId:
