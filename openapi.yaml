  headers:
    RateLimit-Limit:
      description: Nombre de requêtes autorisées dans la fenêtre technique.
      schema:
        type: integer
        minimum: 1
      example: 100
    RateLimit-Remaining:
      description: Nombre de requêtes techniques restantes dans cette fenêtre.
      schema:
        type: integer
